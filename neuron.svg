<svg width="100%" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ad00ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style>
    /* 1. CHAOS ENGINE: The Spawning and Dying */
    @keyframes spawn {
      0% { r: 0; opacity: 0; }
      15% { r: 0; opacity: 0; }
      25% { r: 6; opacity: 1; stroke-width: 2; }
      50% { r: 9; opacity: 1; stroke-width: 0; fill: #ad00ff; }
      75% { r: 6; opacity: 1; stroke-width: 2; fill: #00fff2; }
      90% { r: 2; opacity: 0.5; }
      100% { r: 0; opacity: 0; }
    }

    /* 2. DATA TRANSMISSION: Packets moving along wires */
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }

    /* 3. FLOAT PHYSICS: Drifting in space */
    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      33% { transform: translateY(-15px) translateX(10px); }
      66% { transform: translateY(10px) translateX(-5px); }
    }

    /* BASE STYLES */
    .bg { fill: #0a0b10; }
    
    .connection {
      stroke: url(#cyber-grad);
      stroke-width: 1;
      opacity: 0.3;
      fill: none;
    }

    .data-stream {
      stroke: #fff;
      stroke-width: 2;
      stroke-dasharray: 5 100; /* Creates the "packet" dot effect */
      stroke-linecap: round;
      fill: none;
      filter: url(#neon-glow);
      opacity: 0.8;
      animation: dash 3s linear infinite;
    }

    .node {
      fill: #00fff2;
      stroke: #fff;
      filter: url(#neon-glow);
    }

    /* RANDOMIZERS */
    /* We assign these to make it look chaotic and non-repeating */
    .chaos-1 { animation: spawn 4s infinite ease-in-out; }
    .chaos-2 { animation: spawn 7s infinite ease-in-out; }
    .chaos-3 { animation: spawn 5s infinite ease-in-out; }
    .chaos-4 { animation: spawn 9s infinite ease-in-out; }
    
    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 1.5s; }
    .delay-3 { animation-delay: 3.2s; }
    .delay-4 { animation-delay: 5.1s; }

    .drift-layer { animation: float 20s ease-in-out infinite; transform-origin: center; }

  </style>

  <rect width="100%" height="100%" class="bg" rx="15" />

  <g class="drift-layer">
    
    <path d="M100 200 Q 250 50 400 200 T 700 200" class="connection" />
    <path d="M100 200 Q 250 350 400 200 T 700 200" class="connection" />
    <path d="M400 200 L 400 50" class="connection" />
    <path d="M400 200 L 400 350" class="connection" />
    <path d="M250 125 L 550 275" class="connection" />
    <path d="M250 275 L 550 125" class="connection" />

    <path d="M100 200 Q 250 50 400 200 T 700 200" class="data-stream" style="animation-duration: 4s;" />
    <path d="M700 200 Q 550 350 400 200 T 100 200" class="data-stream" style="animation-duration: 6s;" />
    
    <circle cx="100" cy="200" class="node chaos-3 delay-1" />
    <circle cx="250" cy="125" class="node chaos-1 delay-2" />
    <circle cx="250" cy="275" class="node chaos-2 delay-3" />

    <circle cx="400" cy="200" r="15" fill="none" stroke="#ad00ff" stroke-width="2" class="drift-layer" />
    <circle cx="400" cy="200" class="node chaos-4 delay-1" /> <circle cx="400" cy="50" class="node chaos-2 delay-4" />
    <circle cx="400" cy="350" class="node chaos-1 delay-2" />

    <circle cx="550" cy="125" class="node chaos-3 delay-1" />
    <circle cx="550" cy="275" class="node chaos-2 delay-4" />
    <circle cx="700" cy="200" class="node chaos-1 delay-3" />

    <circle cx="300" cy="180" class="node chaos-1 delay-4" />
    <circle cx="500" cy="220" class="node chaos-3 delay-2" />
    <circle cx="450" cy="100" class="node chaos-2 delay-1" />

  </g>

  <text x="30" y="30" fill="#00fff2" font-family="Courier New" font-size="10" font-weight="bold" opacity="0.7">
    // NEURAL_ARCH: POLYMATH_V1
  </text>
  <text x="30" y="45" fill="#ad00ff" font-family="Courier New" font-size="10" font-weight="bold" opacity="0.7">
    // STATUS: EVOLVING...
  </text>

</svg>
