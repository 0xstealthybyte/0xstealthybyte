<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0%, 100% { fill: #001122; stroke: #00d4ff; stroke-width: 1; filter: blur(1px); }
      50% { fill: #00d4ff; stroke: #ffffff; stroke-width: 3; filter: drop-shadow(0 0 8px #00d4ff); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -40; }
    }
    .neuron { animation: pulse 3s infinite ease-in-out; }
    .synapse { 
      stroke: #00d4ff; 
      stroke-width: 1.5; 
      stroke-dasharray: 4 16; 
      stroke-linecap: round;
      animation: flow 1s linear infinite; 
      opacity: 0.4;
    }
  </style>

  <rect width="800" height="400" fill="#0d1117" rx="10"/>

  <g class="network">
    <path d="M150 200 L300 100" class="synapse" />
    <path d="M150 200 L300 300" class="synapse" />
    <path d="M300 100 L500 100" class="synapse" />
    <path d="M300 300 L500 300" class="synapse" />
    <path d="M500 100 L650 200" class="synapse" />
    <path d="M500 300 L650 200" class="synapse" />
    <path d="M300 100 L500 300" class="synapse" />
    <path d="M300 300 L500 100" class="synapse" />
  </g>

  <circle cx="150" cy="200" r="8" class="neuron" style="animation-delay: 0s" />
  <circle cx="300" cy="100" r="8" class="neuron" style="animation-delay: 0.5s" />
  <circle cx="300" cy="300" r="8" class="neuron" style="animation-delay: 1s" />
  <circle cx="500" cy="100" r="8" class="neuron" style="animation-delay: 1.5s" />
  <circle cx="500" cy="300" r="8" class="neuron" style="animation-delay: 2s" />
  <circle cx="650" cy="200" r="8" class="neuron" style="animation-delay: 2.5s" />

  <text x="400" y="370" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="16" font-weight="bold">
    EXTREME LOGIC SIMULATION :: ACTIVE
  </text>
</svg>
