<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Random Movement Drifts */
    @keyframes drift1 { 0% { transform: translate(0,0); } 50% { transform: translate(30px, -40px); } 100% { transform: translate(0,0); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 50% { transform: translate(-40px, 20px); } 100% { transform: translate(0,0); } }
    
    /* Spawning and Dying (Life Cycle) */
    @keyframes spawn-die {
      0% { r: 0; opacity: 0; }
      20% { r: 6; opacity: 1; stroke-width: 3; }
      50% { r: 8; opacity: 1; stroke-width: 1; }
      80% { r: 4; opacity: 0.6; }
      100% { r: 0; opacity: 0; }
    }

    /* Synapse Firing */
    @keyframes fire {
      0% { stroke-dashoffset: 50; opacity: 0; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -50; opacity: 0; }
    }

    /* Rotation */
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Class Definitions */
    .bg { fill: #0d1117; }
    .neuron { fill: #001122; stroke: #00ffff; stroke-width: 2; filter: url(#glow); }
    .synapse { stroke: #00ffff; stroke-width: 1; stroke-dasharray: 5, 5; opacity: 0.5; }
    
    /* Timing Randomizers (Prime Numbers to prevent looping patterns) */
    .move-1 { animation: drift1 7s ease-in-out infinite; }
    .move-2 { animation: drift2 11s ease-in-out infinite; }
    
    .life-fast { animation: spawn-die 3s infinite; }
    .life-med  { animation: spawn-die 7s infinite; }
    .life-slow { animation: spawn-die 13s infinite; }
    
    .active-fire { animation: fire 1.5s linear infinite; }
    .rotator { transform-origin: center; animation: spin 20s linear infinite; }
  </style>

  <rect width="100%" height="100%" class="bg" rx="10" />

  <g transform="translate(400, 200)">
    <g class="rotator">
        <line x1="0" y1="0" x2="100" y2="0" class="synapse active-fire" />
        <line x1="0" y1="0" x2="-80" y2="80" class="synapse active-fire" style="animation-delay: 0.5s"/>
        <line x1="0" y1="0" x2="50" y2="-100" class="synapse active-fire" style="animation-delay: 1.2s"/>
    </g>
    <circle r="12" fill="#00ffff" filter="url(#glow)" />
  </g>

  <circle cx="150" cy="100" class="neuron move-1 life-med" style="animation-delay: 0s" />
  <circle cx="600" cy="300" class="neuron move-2 life-fast" style="animation-delay: 2.1s" />
  <circle cx="200" cy="300" class="neuron move-1 life-slow" style="animation-delay: 5.5s" />
  <circle cx="700" cy="100" class="neuron move-2 life-med" style="animation-delay: 1.2s" />
  <circle cx="500" cy="100" class="neuron move-1 life-fast" style="animation-delay: 3.3s" />
  
  <text x="20" y="380" fill="#005577" font-family="monospace" font-size="12">
    NEURAL_SIMULATION :: CHAOS_MODE :: ACTIVE
  </text>
</svg>
