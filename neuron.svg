<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 1. CHAOTIC MOVEMENT */
    @keyframes drift1 { 0% { transform: translate(0,0); } 50% { transform: translate(30px, -40px); } 100% { transform: translate(0,0); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 50% { transform: translate(-40px, 20px); } 100% { transform: translate(0,0); } }
    @keyframes drift3 { 0% { transform: translate(0,0); } 50% { transform: translate(20px, 50px); } 100% { transform: translate(0,0); } }

    /* 2. SPAWN & DIE SIMULATION */
    @keyframes life-cycle {
      0% { r: 0; opacity: 0; }
      10% { r: 3; opacity: 0.5; }
      20% { r: 8; opacity: 1; stroke-width: 3; }
      80% { r: 8; opacity: 1; stroke-width: 1; }
      90% { r: 4; opacity: 0.5; }
      100% { r: 0; opacity: 0; }
    }

    /* 3. SYNAPSE FIRING */
    @keyframes fire {
      0% { stroke-dashoffset: 100; opacity: 0; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -100; opacity: 0; }
    }

    /* 4. ROTATING SEARCH */
    @keyframes search { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Base Styles */
    .bg { fill: #050a10; }
    .neuron { fill: #001122; stroke: #00ffff; stroke-width: 2; filter: url(#glow); }
    .core { fill: #00ffff; }
    .synapse { stroke: #00ffff; stroke-width: 1; stroke-dasharray: 5, 5; opacity: 0.3; }
    
    /* Randomizing Classes */
    .m1 { animation: drift1 7s ease-in-out infinite; }
    .m2 { animation: drift2 11s ease-in-out infinite; }
    .m3 { animation: drift3 5s ease-in-out infinite; }
    
    .cycle-fast { animation: life-cycle 4s infinite; }
    .cycle-med  { animation: life-cycle 7s infinite; }
    .cycle-slow { animation: life-cycle 12s infinite; }
    
    .pulse-line { animation: fire 2s linear infinite; }
    .spinner { animation: search 20s linear infinite; transform-origin: center; }

  </style>

  <rect width="100%" height="100%" class="bg" rx="10" />

  <g transform="translate(200, 200)">
    <g class="spinner">
      <line x1="0" y1="0" x2="100" y2="50" class="synapse pulse-line" />
      <line x1="0" y1="0" x2="-80" y2="80" class="synapse pulse-line" style="animation-delay: 0.5s"/>
      <line x1="0" y1="0" x2="50" y2="-100" class="synapse pulse-line" style="animation-delay: 1.2s"/>
    </g>
    <circle r="12" class="neuron m1" />
  </g>

  <g transform="translate(600, 150)">
    <line x1="0" y1="0" x2="-100" y2="100" class="synapse" />
    <line x1="0" y1="0" x2="50" y2="100" class="synapse" />
    <circle r="10" class="neuron m2" />
    <circle cx="-100" cy="100" r="6" class="neuron m3 cycle-med" />
    <circle cx="50" cy="100" r="6" class="neuron m1 cycle-fast" />
  </g>

  <circle cx="100" cy="100" class="neuron m3 cycle-slow" style="animation-delay: 0s" />
  <circle cx="400" cy="300" class="neuron m1 cycle-fast" style="animation-delay: 2.3s" />
  <circle cx="700" cy="300" class="neuron m2 cycle-med" style="animation-delay: 1.1s" />
  <circle cx="350" cy="50"  class="neuron m3 cycle-slow" style="animation-delay: 5.7s" />
  <circle cx="500" cy="250" class="neuron m1 cycle-med" style="animation-delay: 3.4s" />
  
  <path d="M200 200 Q 400 50 600 150" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="10 20" class="pulse-line" opacity="0.5"/>

  <text x="20" y="380" fill="#005577" font-family="monospace" font-size="12">
    SYSTEM_ENTROPY: 84% // NEURAL_SPAWN_RATE: HIGH
  </text>
</svg>
